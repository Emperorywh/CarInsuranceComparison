# 本地开发数据库：仅 PostgreSQL，不含其他常驻服务。
# 宿主机使用 5433 端口，避免与本机已安装的 PostgreSQL(5432) 冲突；
# 凭据与端口需与仓库根目录 .env 中的 DATABASE_URL 保持一致。
services:
  postgres:
    image: postgres:17-alpine
    container_name: car-insurance-postgres
    environment:
      # 开发环境专用凭据；生产部署请自行更换并保证 .env 不入库
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: car_insurance
    ports:
      - "5433:5432"
    volumes:
      # 数据落在命名卷中，docker compose down -v 才会彻底清除（删除即不可恢复）
      - car_insurance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_insurance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  car_insurance_pgdata:
