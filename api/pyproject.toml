[project]
name = "api"
version = "0.1.0"
description = "车险报价对比助手后端（FastAPI + SQLAlchemy async + Alembic + PostgreSQL）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 实际直接使用的运行依赖逐一显式声明，不依赖 fastapi[standard] 的传递引入
    "fastapi>=0.141.1",
    "uvicorn>=0.37.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # TASK-03：PDF 用 pypdfium2（PDFium 的 Apache-2.0 绑定，规避 PyMuPDF 的 AGPL
    # 分发风险）；图片用 Pillow。两者仅做上传期预检与验证，页面渲染在 TASK-04。
    "pypdfium2>=4.30.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.20",
    # TASK-04：OpenAI 兼容视觉 provider 的 HTTP 客户端（原先仅 dev 组用于测试）
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.27.0",
    "ruff>=0.14.0",
    # 仅测试用于生成合法/加密 PDF 夹具（运行时不依赖）
    "pypdf>=5.0.0",
]

[tool.pytest.ini_options]
# 测试统一放在 api/tests；asyncio 用 auto 模式；根目录进 sys.path 以便导入 app 包
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# 仅做检查不自动格式化；行宽与中文注释友好
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # import 排序
    "B",   # 常见缺陷
    "UP",  # pyupgrade
    "SIM", # 简化建议
]
# E501 由 format 工具负责，这里放宽避免长中文注释报错
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的惯用法（Depends 默认参数）不适用 B008
"app/api/**" = ["B008"]
# ApiResponse 保留 Generic[T] 写法（Pydantic/FastAPI 泛型响应模型的兼容方式），
# 不迁移到 PEP 695 新语法
"app/core/responses.py" = ["UP046"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
